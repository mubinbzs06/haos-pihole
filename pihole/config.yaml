name: "Pi-hole"
version: "2026.10.3"
slug: "pihole"
description: "Run the official Pi-hole Docker image on Home Assistant OS."
url: "https://github.com/mubinbzs06/haos-pihole"
image: "pihole/pihole"
legacy: true
arch:
  - aarch64
  - armv7
  - amd64
startup: application
stage: experimental
boot: auto
webui: "http://[HOST]:[PORT:80]/admin/"
ports:
  "53/tcp": 55
  "53/udp": 55
  "80/tcp": 8081
ports_description:
  "53/tcp": "DNS over TCP (host port 55)"
  "53/udp": "DNS over UDP (host port 55)"
  "80/tcp": "Pi-hole web interface (host port 8081)"
map:
  - type: app_config
    read_only: false
    path: /etc/pihole
environment:
  FTLCONF_dns_listeningMode: "ALL"
backup: cold
