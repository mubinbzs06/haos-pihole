name: "Pi-hole"
# renovate: datasource=docker depName=pihole/pihole
version: "2026.10.1"
slug: "pihole"
description: "Run the official Pi-hole container on Home Assistant OS."
url: "https://github.com/mubinbzs06/haos-pihole"
init: false
arch:
  - aarch64
  - amd64
startup: application
stage: experimental
boot: auto
watchdog: "tcp://[HOST]:[PORT:53]"
webui: "http://[HOST]:[PORT:80]/admin/"
ports:
  "53/tcp": 53
  "53/udp": 53
  "80/tcp": 8081
ports_description:
  "53/tcp": "DNS over TCP"
  "53/udp": "DNS over UDP"
  "80/tcp": "Pi-hole web interface"
map:
  - type: app_config
    read_only: false
    path: /etc/pihole
environment:
  FTLCONF_dns_listeningMode: "ALL"
options:
  timezone: "UTC"
  upstream_dns: []
schema:
  password: "password?"
  timezone: "str?"
  upstream_dns:
    - "str?"
backup: cold
