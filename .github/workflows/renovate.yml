name: Renovate

on:
  schedule:
    # Daily dependency scan at 07:23 UTC.
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Check and propose dependency updates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.14
        env:
          RENOVATE_REPOSITORIES: mubinbzs06/haos-pihole
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
